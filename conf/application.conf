include "frontend.conf"

appName = "income-tax-obligations-frontend"
play.http.router = prod.Routes
play.ws.ssl.enabledProtocols = [
  "TLSv1.2",
  "TLSv1.1"
]

play.i18n.langCookieHttpOnly = true
play.i18n.langs = ["en", "cy"]

play.filters.enabled += play.filters.csp.CSPFilter

# Custom error handler
play.http.errorHandler = "config.ItvcErrorHandler"

# Play Modules
# ~~~~
play.modules.enabled += "config.DIModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
# retry mechanism in http-verbs handles "SSLEngine closed already" exceptions
http-verbs.retries.ssl-engine-closed-already.enabled = true

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
# Not set here so that MDTP frontends share the same secret key in the local environment
# (see common.conf in frontend-bootstrap).
# In server environments the secret comes from app-config-common
# play.crypto.secret="I28h0dBysYRW6m1z3z4sLOLCoiXPg286ON5VwwRjSrmnJaBhjgWVtDNe41edoo0s"

# Frontend Bootsteap Session Timeout Settings
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# A custom session timeout can be set here for testing, but should be left at the default
# which is 15 minutes in production. Hence is commented out, unless required.

# session.timeoutSeconds = 20
mongodb.timeToLiveInSeconds = 900

play.http.parser.maxMemoryBuffer = 325kB

microservice {
  services {
    auth {
      host = "localhost"
      port = 8500
      protocol = "http"
    }

    citizen-details {
      host = localhost
      port = 9337
    }

    income-tax-business-details {
      host = localhost
      port = 9089
    }

    income-tax-calculation {
      host = localhost
      port = 9314
    }

    income-tax-obligations {
      host = localhost
      port = 9076
    }

    income-tax-session-data {
      host = localhost
      port = 30027
    }

    itvc-dynamic-stub {
      host = localhost
      port = 65535
    }
  }
}

identity-verification-frontend.use-relative-params: false

urls {
  agent-services-account-frontend = "https://localhost:9401"
  business-tax-account = "https://localhost:9020"
  contact-frontend = "https://localhost:9250"
  feedback-frontend = "https://localhost:9514"
  government-gateway = "https://localhost:9553"
  help-and-contact-frontend = "https://localhost:9733"
  identity-verification-frontend = "https://localhost:9948"
  income-tax-view-change-frontend = "https://localhost:9081"
  personal-tax-account = "https://localhost:9232"
  tracking-frontend = "https://localhost:9100"
}
# This config should replicate whats in production.
# so that helps to Prod features button on test-only/feature-switch page.
# We use test-only/feature-switch page for tweaking feature switches.
feature-switch {
  enable-charge-history = false
  enable-credits-refunds-repay = false
  enable-display-business-start-date = false
  enable-filter-coded-out-poas = true
  enable-itsa-submission-integration = false
  enable-nav-bar = false
  enable-opt-out = true
  enable-sign-up = true
  enable-payment-history-refunds = false
  enable-penalties-and-appeals = true
  enable-penalties-backend = false
  enable-session-data-storage = false
  enable-time-machine = true
  enable-triggered-migration = false
  enable-submit-claim-to-adjust-to-nrs = false
  enable-post-finalisation-amendments-r18 = true
  enable-cy-plus-one-you-must-wait-to-sign-up-page-enabled = false
  enable-new-home-page = false
  enable-overseas-business-address = false
  enable-recent-activity = false
  enable-mortgage-evidence = false
  read-from-mongo = false
}

#  Keep this false for local environment
#  When true, the application attempts to call mongo for all feature switches
#  This results in a lot of tests failing
#  In the Staging Environment, this will be flipped to true
#  Therefore changing the state of FS(s) will be easier during demos

feature-switches.read-from-mongo = false

mongodb {
  uri = "mongodb://localhost:27017/income-tax-obligations-frontend"
  income-tax-obligations-frontend {
    maxSize = 512000
    feature-switches {
      name = feature-switches
    }
  }
}


enrolments {
  mtd {
    key = "HMRC-MTD-IT"
    identifier = "MTDITID"
  }

  nino {
    key = "HMRC-NI"
    identifier = "NINO"
  }

  sa {
    key = "IR-SA"
    identifier = "UTR"
  }

  arn {
    key = "HMRC-AS-AGENT"
    identifier = "AgentReferenceNumber"
  }
}

base {
  url = "http://localhost:9088"
  context-root = "/manage-self-assessment/obligations"
  fullUrl = ${base.url}${base.context-root}
  sign-in = ${base.fullUrl}"/sign-in"
}


gov-links {
  mtd-subscription-service.url = "https://www.gov.uk/guidance/use-software-to-send-income-tax-updates"
  set-up-agent-services-account.url = "https://www.gov.uk/guidance/get-an-hmrc-agent-services-account"
  tax-appeals.url = "https://www.gov.uk/tax-appeals"
  compatible-software.url = "https://www.gov.uk/guidance/choose-the-right-software-for-making-tax-digital-for-income-tax"
}

enter-survey.url = "https://signup.take-part-in-research.service.gov.uk/?utm_campaign=IncomeTaxViewChange&utm_source=Other&utm_medium=other&t=HMRC&id=33"

tracking-consent-frontend {
  gtm.container = "b"
}

claim-to-adjust {
  timeout = 60
}

payment-history {
  number-of-years = 7
}

auth.confidenceLevel = 250

time-machine {
  add-years = 0
  add-days = 0
}

afterIncomeSourceCreated = [
  "business-added",
  "uk-property-added",
  "foreign-property-added",
  "foreign-property-reporting-method",
  "uk-property-reporting-method",
  "uk-property-will-report",
  "foreign-property-will-report",
  "confirm-you-want-to-report-uk-property",
  "confirm-you-want-to-report-foreign-property",
  "reporting-frequency",
  "cease-success",
  "choose-taxyear"
]


afterMigration = [
  "complete",
  "view",
  "client-income-tax"
]

bootstrap.http.headersAllowlist = [ "Gov-Test-Scenario", "Location", "X-Request-Timestamp", "X-Session-Id" ]

internalServiceHostPatterns = [ "localhost" ]

thresholds = {
  prethreshold2027 = "£50,000"
  threshold2027 = "£30,000"
  threshold2028 = "£20,000"
}

play-frontend-hmrc.useRebrand = true

